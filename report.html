<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สรุปผลการตรวจ — ห้องเรียนสะอาด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .tab-bar {
      display        : flex;
      gap            : .5rem;
      margin-bottom  : 1.25rem;
      border-bottom  : 2px solid var(--gray-200);
      padding-bottom : .5rem;
      flex-wrap      : wrap;
    }
    .tab-btn {
      padding      : .5rem 1.125rem;
      border-radius: var(--radius);
      border       : 1.5px solid var(--gray-200);
      background   : var(--white);
      font-family  : inherit;
      font-size    : .9375rem;
      font-weight  : 600;
      cursor       : pointer;
      color        : var(--gray-600);
      transition   : all var(--transition);
    }
    .tab-btn:hover  { border-color: var(--primary); color: var(--primary); }
    .tab-btn.active {
      background   : var(--primary);
      border-color : var(--primary);
      color        : var(--white);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .building-header {
      background   : var(--primary-light);
      color        : var(--primary);
      font-weight  : 700;
      padding      : .5rem .875rem;
      border-radius: var(--radius);
      margin       : 1rem 0 .5rem;
      font-size    : .9375rem;
    }
    .no-data {
      text-align : center;
      padding    : 2.5rem 0;
      color      : var(--gray-400);
      font-size  : 1rem;
    }
    /* ── Popup Modal ──────────────────────────────────────── */
    .modal-overlay {
      display        : none;
      position       : fixed;
      inset          : 0;
      background     : rgba(0,0,0,.45);
      z-index        : 200;
      align-items    : center;
      justify-content: center;
      padding        : 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background   : var(--white);
      border-radius: var(--radius-lg);
      box-shadow   : var(--shadow-md);
      width        : 100%;
      max-width    : 560px;
      max-height   : 80vh;
      overflow-y   : auto;
      padding      : 1.5rem;
    }
    .modal-header {
      display        : flex;
      align-items    : center;
      justify-content: space-between;
      margin-bottom  : 1rem;
      padding-bottom : .75rem;
      border-bottom  : 2px solid var(--gray-100);
    }
    .modal-close {
      background : none;
      border     : none;
      font-size  : 1.25rem;
      cursor     : pointer;
      color      : var(--gray-400);
      line-height: 1;
    }
    .modal-close:hover { color: var(--danger); }
    /* badge มีการแก้ไข */
    .edited-badge {
      display      : inline-flex;
      align-items  : center;
      gap          : .2rem;
      font-size    : .75rem;
      color        : var(--warning);
      cursor       : pointer;
      margin-left  : .375rem;
      vertical-align: middle;
    }
    .edited-badge:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <span>🏫</span>ห้องเรียนสะอาด
      </a>
      <div class="navbar-menu" id="navbar-menu">
        <a href="index.html" class="btn btn-ghost btn-sm">🏠 หน้าหลัก</a>
        <a href="login.html" class="btn btn-ghost btn-sm" id="btn-inspector">เข้าสู่ระบบ (ผู้ตรวจ)</a>
      </div>
    </div>
  </nav>

  <!-- ── Main ───────────────────────────────────────────── -->
  <main class="container" style="padding: 1.5rem 1rem 3rem;">

    <h2 style="margin-bottom: 1.25rem;">📊 สรุปผลการตรวจ</h2>

    <!-- ── Tab Bar ──────────────────────────────────────── -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="daily">📅 รายวัน</button>
      <button class="tab-btn" data-tab="monthly">📆 รายเดือน</button>
      <button class="tab-btn" data-tab="term">📚 รายภาคเรียน</button>
    </div>

    <!-- ════════════════════════════════════════════════════
         Tab 1 — รายวัน
    ════════════════════════════════════════════════════ -->
    <div class="tab-panel active" id="panel-daily">
      <div class="card">
        <div class="filter-bar">
          <div class="form-group">
            <label class="form-label" for="daily-date">เลือกวันที่</label>
            <input type="date" id="daily-date" class="form-control" />
          </div>
          <button class="btn btn-primary" id="btn-daily-load">ดูผล</button>
        </div>

        <div id="daily-result">
          <p class="text-muted">เลือกวันที่แล้วกด "ดูผล"</p>
        </div>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════
         Tab 2 — รายเดือน
    ════════════════════════════════════════════════════ -->
    <div class="tab-panel" id="panel-monthly">
      <div class="card">
        <div class="filter-bar">
          <div class="form-group">
            <label class="form-label" for="monthly-month">เลือกเดือน</label>
            <input type="month" id="monthly-month" class="form-control" />
          </div>
          <div class="form-group">
            <label class="form-label" for="monthly-level">ระดับชั้น</label>
            <select id="monthly-level" class="form-control">
              <option value="">ทั้งหมด</option>
              <option value="ม.ต้น">ม.ต้น</option>
              <option value="ม.ปลาย">ม.ปลาย</option>
            </select>
          </div>
          <button class="btn btn-primary" id="btn-monthly-load">ดูผล</button>
        </div>

        <div id="monthly-result">
          <p class="text-muted">เลือกเดือนแล้วกด "ดูผล"</p>
        </div>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════
         Tab 3 — รายภาคเรียน (เลือกช่วงเดือนเอง)
    ════════════════════════════════════════════════════ -->
    <div class="tab-panel" id="panel-term">
      <div class="card">
        <div class="filter-bar">
          <div class="form-group">
            <label class="form-label" for="term-preset">ภาคเรียนมาตรฐาน</label>
            <select id="term-preset" class="form-control">
              <option value="">— กำหนดเอง —</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="term-start">ตั้งแต่เดือน</label>
            <input type="month" id="term-start" class="form-control" />
          </div>
          <div class="form-group">
            <label class="form-label" for="term-end">ถึงเดือน</label>
            <input type="month" id="term-end" class="form-control" />
          </div>
          <button class="btn btn-primary" id="btn-term-load">ดูผล</button>
        </div>

        <div id="term-result">
          <p class="text-muted">เลือกภาคเรียนหรือช่วงเดือนแล้วกด "ดูผล"</p>
        </div>
      </div>
    </div>

  </main>

  <!-- ── Popup Modal (log การแก้ไข) ────────────────────────── -->
  <div class="modal-overlay" id="log-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">ประวัติการแก้ไข</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div id="modal-body">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- ── Scripts ─────────────────────────────────────────── -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    // ── ตั้งค่าเริ่มต้น ────────────────────────────────────

    // วันนี้
    const today = new Date();
    const yyyy  = today.getFullYear();
    const mm    = String(today.getMonth() + 1).padStart(2, '0');
    const dd    = String(today.getDate()).padStart(2, '0');
    document.getElementById('daily-date').value   = `${yyyy}-${mm}-${dd}`;
    document.getElementById('monthly-month').value = `${yyyy}-${mm}`;

    // ── รายภาคเรียน: ช่วงเดือนมาตรฐาน + เลือกช่วงเองได้ ────
    const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

    // 'YYYY-MM' → 'พ.ค. 2569' (short=true → 'พ.ค. 69')
    function thaiMonth(ym, short) {
      const [y, m] = ym.split('-').map(Number);
      const be = y + 543;
      return `${THAI_MONTHS[m - 1]} ${short ? String(be).slice(-2) : be}`;
    }

    const termPresets = [];   // { label, start, end }
    (function buildTermPresets() {
      const curMonth = today.getMonth() + 1;
      const acadYear = curMonth >= 5 ? yyyy : yyyy - 1;
      for (let y = acadYear; y >= acadYear - 2; y--) {
        // ภาค 2 ของปีปัจจุบันยังไม่ถึง ถ้าตอนนี้อยู่ช่วง พ.ค.–ต.ค.
        const t2NotYet = (y === acadYear && curMonth >= 5 && curMonth <= 10);
        if (!t2NotYet) {
          termPresets.push({
            label: `ภาคเรียนที่ 2 ปีการศึกษา ${y + 543} (พ.ย.–เม.ย.)`,
            start: `${y}-11`, end: `${y + 1}-04`
          });
        }
        termPresets.push({
          label: `ภาคเรียนที่ 1 ปีการศึกษา ${y + 543} (พ.ค.–ต.ค.)`,
          start: `${y}-05`, end: `${y}-10`
        });
      }
    })();

    const termPreset = document.getElementById('term-preset');
    const termStart  = document.getElementById('term-start');
    const termEnd    = document.getElementById('term-end');

    termPresets.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value       = String(i);
      opt.textContent = p.label;
      termPreset.appendChild(opt);
    });

    function findPreset(start, end) {
      return termPresets.findIndex(p => p.start === start && p.end === end);
    }
    function applyPreset(i) {
      if (i < 0 || !termPresets[i]) return;
      termStart.value = termPresets[i].start;
      termEnd.value   = termPresets[i].end;
    }

    termPreset.addEventListener('change', () => {
      if (termPreset.value !== '') applyPreset(Number(termPreset.value));
    });
    [termStart, termEnd].forEach(el => el.addEventListener('change', () => {
      const idx = findPreset(termStart.value, termEnd.value);
      termPreset.value = idx >= 0 ? String(idx) : '';
    }));

    // ค่าเริ่มต้น = ภาคเรียนปัจจุบัน
    termPreset.value = '0';
    applyPreset(0);

    // ถ้า login อยู่ → เปลี่ยนปุ่มเป็น "คีย์คะแนน"
    if (isLoggedIn()) {
      const s = getSession();
      const menu = document.getElementById('navbar-menu');
      menu.innerHTML = `
        <span class="navbar-user">${s.display_name}</span>
        <a href="input.html" class="btn btn-ghost btn-sm">📝 คีย์คะแนน</a>
        <button class="btn btn-ghost btn-sm" onclick="logout()">ออกจากระบบ</button>
      `;
    }

    // ── Tab switching ──────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
      });
    });

    // กดจาก URL query string ?view=daily|monthly|term
    const urlView = new URLSearchParams(window.location.search).get('view');
    if (urlView) {
      const targetBtn = document.querySelector(`.tab-btn[data-tab="${urlView}"]`);
      if (targetBtn) targetBtn.click();
    }

    // ════════════════════════════════════════════════════════
    //  Tab 1 — รายวัน
    // ════════════════════════════════════════════════════════
    document.getElementById('btn-daily-load').addEventListener('click', async () => {
      const date = document.getElementById('daily-date').value;
      if (!date) { alert('กรุณาเลือกวันที่'); return; }

      const resultEl = document.getElementById('daily-result');
      resultEl.innerHTML = loadingHTML();

      try {
        const res = await API.getDailyReport(date);
        if (!res.success) { resultEl.innerHTML = errorHTML(res.message); return; }
        if (!res.rooms || res.rooms.length === 0) {
          resultEl.innerHTML = noDataHTML('ไม่พบข้อมูลการตรวจในวันที่เลือก');
          return;
        }
        resultEl.innerHTML = renderDailyTable(res.rooms, date);
      } catch (err) {
        resultEl.innerHTML = errorHTML(err.message);
      }
    });

    function renderDailyTable(rooms, date) {
      // จัดกลุ่มตาม building
      const grouped = {};
      rooms.forEach(r => {
        if (!grouped[r.building]) grouped[r.building] = [];
        grouped[r.building].push(r);
      });

      // นับสถิติ
      const total  = rooms.length;
      const passed = rooms.filter(r => r.passed).length;

      let html = `
        <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap; gap:.5rem;">
          <div>
            <strong>วันที่ ${date}</strong>
            <span class="text-muted" style="margin-left:.5rem;">ตรวจทั้งหมด ${total} ห้อง</span>
          </div>
          <div>
            <span class="badge-pass">✅ ผ่าน ${passed} ห้อง</span>
            &nbsp;
            <span class="badge-fail">❌ ไม่ผ่าน ${total - passed} ห้อง</span>
          </div>
        </div>
      `;

      Object.keys(grouped).sort().forEach(building => {
        html += `<div class="building-header">🏢 ${building}</div>`;
        html += `
          <div style="overflow-x:auto; margin-bottom:.5rem;">
            <table class="report-table">
              <thead>
                <tr>
                  <th class="col-left">ห้อง</th>
                  <th class="col-left">ระดับชั้น</th>
                  ${CONFIG.CRITERIA.map((_, i) => `<th>ข้อ ${i+1}</th>`).join('')}
                  <th>รวม</th>
                  <th>ผล</th>
                  <th class="col-left">ผู้ตรวจ</th>
                  <th class="col-left">เวลาคีย์</th>
                </tr>
              </thead>
              <tbody>
        `;
        grouped[building].forEach(r => {
          // badge ✏️ แสดงทุกคน ถ้ามีการแก้ไข
          const editedCell = r.edited
            ? (isAdmin()
                ? `<span class="edited-badge" style="cursor:pointer;" onclick="openLogModal('${r.room_id}','${date}')">✏️ แก้ไข</span>`
                : `<span class="edited-badge" style="cursor:default;">✏️ แก้ไข</span>`)
            : '';
          const inspectorText = r.inspector_position
            ? `${r.inspector_name} (${r.inspector_position})`
            : r.inspector_name;
          html += `
            <tr>
              <td class="col-left"><strong>${r.room_id}</strong>${editedCell}</td>
              <td class="col-left">${r.homeroom || '-'}</td>
              ${r.scores.map(s => `<td>${s}</td>`).join('')}
              <td><strong>${r.total}</strong></td>
              <td>${r.passed
                ? '<span class="badge-pass">✅ ผ่าน</span>'
                : '<span class="badge-fail">❌ ไม่ผ่าน</span>'
              }</td>
              <td class="col-left">${inspectorText}</td>
              <td class="col-left" style="font-size:.8125rem; color:var(--gray-400);">${r.timestamp || '-'}</td>
            </tr>
          `;
        });
        html += `</tbody></table></div>`;
      });

      return html;
    }

    // ════════════════════════════════════════════════════════
    //  Tab 2 — รายเดือน
    // ════════════════════════════════════════════════════════
    document.getElementById('btn-monthly-load').addEventListener('click', async () => {
      const yearMonth  = document.getElementById('monthly-month').value;
      const classLevel = document.getElementById('monthly-level').value;
      if (!yearMonth) { alert('กรุณาเลือกเดือน'); return; }

      const resultEl = document.getElementById('monthly-result');
      resultEl.innerHTML = loadingHTML();

      try {
        const res = await API.getMonthlyReport(yearMonth, classLevel);
        if (!res.success) { resultEl.innerHTML = errorHTML(res.message); return; }
        if (!res.rooms || res.rooms.length === 0) {
          resultEl.innerHTML = noDataHTML('ไม่พบข้อมูลในเดือนที่เลือก');
          return;
        }
        resultEl.innerHTML = renderMonthlyReport(res, yearMonth);
      } catch (err) {
        resultEl.innerHTML = errorHTML(err.message);
      }
    });

    function renderMonthlyReport(res, yearMonth) {
      const { summary, rooms } = res;

      // stat boxes
      let html = `
        <p style="margin-bottom:.875rem;">
          <strong>เดือน ${yearMonth}</strong>
          <span class="text-muted" style="margin-left:.5rem;">ห้องที่มีข้อมูล ${rooms.length} ห้อง</span>
        </p>
        <div class="stat-grid" style="margin-bottom:1.25rem;">
          <div class="stat-box gold">
            <div class="stat-box-number">🥇</div>
            <div class="stat-box-label" style="font-weight:700;color:#92400e;">เหรียญทอง</div>
            <div class="stat-box-number">${summary.gold.total}</div>
            <div class="stat-box-label">ห้อง</div>
          </div>
          <div class="stat-box silver">
            <div class="stat-box-number">🥈</div>
            <div class="stat-box-label" style="font-weight:700;color:#4b5563;">เหรียญเงิน</div>
            <div class="stat-box-number">${summary.silver.total}</div>
            <div class="stat-box-label">ห้อง</div>
          </div>
          <div class="stat-box bronze">
            <div class="stat-box-number">🥉</div>
            <div class="stat-box-label" style="font-weight:700;color:#92400e;">เหรียญทองแดง</div>
            <div class="stat-box-number">${summary.bronze.total}</div>
            <div class="stat-box-label">ห้อง</div>
          </div>
        </div>
      `;

      // ตารางสรุปเหรียญแยกระดับชั้น (ม.ต้น/ม.ปลาย)
      const allLevels = ['ม.ต้น', 'ม.ปลาย'];
      html += `
        <p style="font-weight:700; margin-bottom:.5rem;">สรุปตามช่วงชั้น</p>
        <div style="overflow-x:auto; margin-bottom:1.25rem;">
          <table class="report-table">
            <thead>
              <tr>
                <th class="col-left">เหรียญ</th>
                ${allLevels.map(l => `<th>${l}</th>`).join('')}
                <th>รวม</th>
              </tr>
            </thead>
            <tbody>
              ${['gold','silver','bronze'].map(medal => `
                <tr>
                  <td class="col-left">
                    <span class="medal-badge ${CONFIG.MEDAL_CLASS[medal]}">
                      ${CONFIG.MEDAL_LABEL[medal]}
                    </span>
                  </td>
                  ${allLevels.map(l => `<td>${summary[medal].by_level[l] || 0}</td>`).join('')}
                  <td><strong>${summary[medal].total}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      // ตารางสรุปเหรียญแยกระดับชั้น (ม.1-ม.6)
      const allGrades = ['ม.1', 'ม.2', 'ม.3', 'ม.4', 'ม.5', 'ม.6'];
      html += `
        <p style="font-weight:700; margin-bottom:.5rem;">สรุปตามระดับชั้น</p>
        <div style="overflow-x:auto; margin-bottom:1.25rem;">
          <table class="report-table">
            <thead>
              <tr>
                <th class="col-left">เหรียญ</th>
                ${allGrades.map(g => `<th>${g}</th>`).join('')}
                <th>รวม</th>
              </tr>
            </thead>
            <tbody>
              ${['gold','silver','bronze'].map(medal => `
                <tr>
                  <td class="col-left">
                    <span class="medal-badge ${CONFIG.MEDAL_CLASS[medal]}">
                      ${CONFIG.MEDAL_LABEL[medal]}
                    </span>
                  </td>
                  ${allGrades.map(g => `<td>${summary[medal].by_grade[g] || 0}</td>`).join('')}
                  <td><strong>${summary[medal].total}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      // ตารางรายห้อง จัดกลุ่มตาม building
      const grouped = {};
      rooms.forEach(r => {
        if (!grouped[r.building]) grouped[r.building] = [];
        grouped[r.building].push(r);
      });

      html += `<h3 style="margin-bottom:.75rem;">รายละเอียดแต่ละห้อง</h3>`;
      Object.keys(grouped).sort().forEach(building => {
        html += `<div class="building-header">🏢 ${building}</div>`;
        html += `
          <div style="overflow-x:auto; margin-bottom:.5rem;">
            <table class="report-table">
              <thead>
                <tr>
                  <th class="col-left">ห้อง</th>
                  <th class="col-left">ระดับชั้น</th>
                  <th>วันตรวจ</th>
                  <th>วันดี</th>
                  <th>%</th>
                  <th>เหรียญ</th>
                </tr>
              </thead>
              <tbody>
        `;
        grouped[building].forEach(r => {
          html += `
            <tr>
              <td class="col-left"><strong>${r.room_id}</strong></td>
              <td class="col-left">${r.homeroom || '-'}</td>
              <td>${r.total_days}</td>
              <td>${r.good_days}</td>
              <td>${r.pct}%</td>
              <td>
                ${r.medal !== 'none'
                  ? `<span class="medal-badge ${CONFIG.MEDAL_CLASS[r.medal]}">${CONFIG.MEDAL_LABEL[r.medal]}</span>`
                  : '<span class="text-muted">—</span>'
                }
              </td>
            </tr>
          `;
        });
        html += `</tbody></table></div>`;
      });

      return html;
    }

    // ════════════════════════════════════════════════════════
    //  Tab 3 — รายภาคเรียน (เลือกช่วงเดือนเอง)
    // ════════════════════════════════════════════════════════
    document.getElementById('btn-term-load').addEventListener('click', async () => {
      const start = termStart.value;
      const end   = termEnd.value;
      if (!start || !end) { alert('กรุณาเลือกเดือนเริ่มต้นและเดือนสิ้นสุด'); return; }
      if (start > end)    { alert('เดือนเริ่มต้นต้องไม่หลังเดือนสิ้นสุด'); return; }

      const resultEl = document.getElementById('term-result');
      resultEl.innerHTML = loadingHTML();

      try {
        const res = await API.getTermReport(start, end);
        if (!res.success) { resultEl.innerHTML = errorHTML(res.message); return; }
        if (!res.months || res.months.length === 0) {
          resultEl.innerHTML = noDataHTML('ไม่พบข้อมูลการตรวจในช่วงเดือนที่เลือก');
          return;
        }
        resultEl.innerHTML = renderTermReport(res, start, end);
      } catch (err) {
        resultEl.innerHTML = errorHTML(err.message);
      }
    });

    const MEDAL_ICON = { gold: '🥇', silver: '🥈', bronze: '🥉', none: '—' };

    function renderTermReport(res, start, end) {
      const { months, skipped_months, rooms, summary } = res;
      const n = months.length;

      const isStandard = findPreset(start, end) >= 0;
      const rangeBadge = isStandard
        ? '<span class="badge-pass">ช่วงมาตรฐาน</span>'
        : '<span style="background:var(--warning-light);color:var(--warning);border:1px solid #fde68a;padding:.2rem .6rem;border-radius:999px;font-size:.8125rem;font-weight:600;">กำหนดเอง</span>';

      let html = `
        <div style="margin-bottom:1rem;">
          <strong>ช่วงที่เลือก: ${thaiMonth(start)} – ${thaiMonth(end)}</strong>
          &nbsp;${rangeBadge}
          <p class="text-muted mt-1">นับ ${n} เดือน: ${months.map(m => thaiMonth(m, true)).join(', ')}</p>
          ${skipped_months && skipped_months.length
            ? `<p class="text-muted">ไม่นับ (ไม่มีข้อมูลการตรวจ): ${skipped_months.map(m => thaiMonth(m, true)).join(', ')}</p>`
            : ''}
        </div>

        <div class="stat-grid">
          <div class="stat-box gold">
            <div class="stat-box-number">🏆 ${summary.certificate_rooms}</div>
            <div class="stat-box-label">ห้องที่ได้เกียรติบัตร</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-number">${summary.total_rooms}</div>
            <div class="stat-box-label">ห้องทั้งหมด</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-number">${n}</div>
            <div class="stat-box-label">เดือนที่นับ</div>
          </div>
        </div>
      `;

      // รายชื่อห้องที่ได้เกียรติบัตร
      const certRooms = rooms.filter(r => r.certificate);
      html += `
        <div class="card" style="border-left:4px solid var(--gold); padding:1rem 1.25rem; margin-bottom:1.25rem;">
          <strong>🏆 ห้องที่ได้เหรียญทองครบทุกเดือน (เกียรติบัตรประจำเทอม)</strong>
          <div style="margin-top:.5rem;">
            ${certRooms.length
              ? certRooms.map(r =>
                  `<span class="medal-badge medal-gold" style="margin:.2rem .25rem .2rem 0;">${r.room_id} (${r.homeroom || '-'})</span>`
                ).join('')
              : '<span class="text-muted">ยังไม่มีห้องที่ได้เหรียญทองครบทุกเดือน</span>'}
          </div>
        </div>
      `;

      // ตารางรายห้อง จัดกลุ่มตามอาคาร
      const grouped = {};
      rooms.forEach(r => {
        if (!grouped[r.building]) grouped[r.building] = [];
        grouped[r.building].push(r);
      });

      Object.keys(grouped).sort().forEach(building => {
        html += `<div class="building-header">🏢 ${building}</div>`;
        html += `
          <div style="overflow-x:auto; margin-bottom:.5rem;">
            <table class="report-table">
              <thead>
                <tr>
                  <th class="col-left">ห้อง</th>
                  <th class="col-left">ห้องเรียน</th>
                  ${months.map(m => `<th>${thaiMonth(m, true)}</th>`).join('')}
                  <th>🥇 ทอง</th>
                  <th>🥈 เงิน</th>
                  <th>🥉 ทองแดง</th>
                  <th>เกียรติบัตร</th>
                </tr>
              </thead>
              <tbody>
        `;
        grouped[building].forEach(r => {
          const monthCells = r.monthly.map(mm => {
            const tip = mm.total_days
              ? `วันดี ${mm.good_days}/${mm.total_days} วัน`
              : 'ไม่มีข้อมูลการตรวจ';
            return `<td title="${tip}">${MEDAL_ICON[mm.medal]}</td>`;
          }).join('');

          html += `
            <tr${r.certificate ? ' style="background:var(--gold-light);"' : ''}>
              <td class="col-left"><strong>${r.room_id}</strong></td>
              <td class="col-left">${r.homeroom || '-'}</td>
              ${monthCells}
              <td><strong>${r.gold}</strong>/${n}</td>
              <td>${r.silver || '—'}</td>
              <td>${r.bronze || '—'}</td>
              <td>${r.certificate ? '🏆' : ''}</td>
            </tr>
          `;
        });
        html += `</tbody></table></div>`;
      });

      return html;
    }

    // ════════════════════════════════════════════════════════
    //  Helper HTML snippets
    // ════════════════════════════════════════════════════════
    function loadingHTML() {
      return `
        <div class="spinner-wrap">
          <div class="spinner"></div>
          <span>กำลังโหลดข้อมูล...</span>
        </div>
      `;
    }

    function errorHTML(msg) {
      return `<div class="alert alert-danger">❌ เกิดข้อผิดพลาด: ${msg}</div>`;
    }

    function noDataHTML(msg) {
      return `<div class="no-data">📭 ${msg}</div>`;
    }

    // ════════════════════════════════════════════════════════
    //  Popup Modal — ประวัติการแก้ไข (admin เท่านั้น)
    // ════════════════════════════════════════════════════════
    const modal      = document.getElementById('log-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody  = document.getElementById('modal-body');

    document.getElementById('modal-close').addEventListener('click', () => {
      modal.classList.remove('active');
    });
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.classList.remove('active');
    });

    async function openLogModal(room_id, date) {
      if (!isAdmin()) return;
      modalTitle.textContent = `ประวัติการแก้ไข — ห้อง ${room_id} วันที่ ${date}`;
      modalBody.innerHTML    = loadingHTML();
      modal.classList.add('active');

      try {
        const res = await API.getScoreLogs(room_id, date);
        if (!res.success) {
          modalBody.innerHTML = errorHTML(res.message);
          return;
        }
        if (!res.logs || res.logs.length === 0) {
          modalBody.innerHTML = noDataHTML('ไม่พบประวัติการแก้ไข');
          return;
        }
        modalBody.innerHTML = renderLogTable(res.logs);
      } catch (err) {
        modalBody.innerHTML = errorHTML(err.message);
      }
    }

    function renderLogTable(logs) {
      let html = `
        <p class="text-muted" style="margin-bottom:.875rem;">
          พบการแก้ไขทั้งหมด <strong>${logs.length}</strong> ครั้ง
        </p>
        <div style="overflow-x:auto;">
          <table class="report-table">
            <thead>
              <tr>
                <th class="col-left">เวลา</th>
                <th class="col-left">ผู้แก้ไข</th>
                <th>คะแนนเดิม</th>
                <th>รวมเดิม</th>
                <th>คะแนนใหม่</th>
                <th>รวมใหม่</th>
              </tr>
            </thead>
            <tbody>
      `;
      logs.forEach(log => {
        const inspectorText = log.inspector_position
          ? `${log.inspector_name} (${log.inspector_position})`
          : log.inspector_name;
        html += `
          <tr>
            <td class="col-left" style="font-size:.8125rem;">${log.timestamp}</td>
            <td class="col-left">${inspectorText}</td>
            <td style="font-size:.8125rem;">${log.old_scores.join(', ')}</td>
            <td><strong style="color:var(--danger);">${log.old_total}</strong></td>
            <td style="font-size:.8125rem;">${log.new_scores.join(', ')}</td>
            <td><strong style="color:var(--success);">${log.new_total}</strong></td>
          </tr>
        `;
      });
      html += `</tbody></table></div>`;
      return html;
    }

  </script>

</body>
</html>
